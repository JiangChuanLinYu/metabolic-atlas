<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Metabolic Atlas</title><link rel="stylesheet" href="style.css?v=72270a8f530a"></head><body>
<header class="topbar"><button id="mobile-menu" aria-label="展开或收起通路栏" aria-expanded="true" title="展开或收起通路栏">☰</button><span class="brand">Metabolic Atlas</span><div class="segmented" id="groups" aria-label="Cell groups"></div><select id="cell" aria-label="Cell type"></select><div class="atlas-toolbar" aria-label="图谱视图工具"><button id="atlas-zoom-out" aria-label="缩小" title="缩小">−</button><span id="atlas-zoom-label">100%</span><button id="atlas-zoom-in" aria-label="放大" title="放大">+</button><button id="atlas-fit">全图</button><button id="atlas-focus">定位已选</button></div></header>
<div class="workspace"><aside id="sidebar"><div class="sidebar-heading"><h2>通路</h2><span id="path-count"></span><button id="collapse">Collapse all</button></div><label class="search"><input id="search" type="search" placeholder="搜索通路…" aria-label="搜索通路"><kbd>/</kbd></label><form id="route-search"><label for="route-query">物质或酶</label><input id="route-query" list="route-suggestions" placeholder="例如 G6P、ATP、PFK-1" autocomplete="off" required><label for="route-target">目标物质 <span>（选填，填写后查路径）</span></label><input id="route-target" list="route-suggestions" placeholder="例如 Pyr" autocomplete="off"><button id="route-submit" type="submit">查看详情</button><datalist id="route-suggestions"></datalist></form><section id="route-results" aria-live="polite" hidden></section><nav id="modules" aria-label="Pathway modules"></nav></aside>
<main><section class="selected-pathways" aria-labelledby="selected-pathways-title"><div class="selected-pathways-heading"><h2 id="selected-pathways-title">已选 <span id="atlas-selected-count">0</span></h2><button id="atlas-select-all">全选</button><button id="atlas-clear">清空</button></div><div id="atlas-selected" aria-label="已选通路"></div></section><div class="atlas-viewport" tabindex="0" aria-label="代谢通路图谱，滚轮缩放，按住空格和鼠标左键拖动" title="滚轮缩放 · 空格 + 鼠标左键拖动"><div id="atlas-stage"><div id="atlas-map"></div></div></div><p id="atlas-status" role="status"></p></main></div>
<script src="availability.js?v=234db1ff6eb8"></script><script src="app.js?v=1a859b189959"></script><script src="atlas-data.js?v=bc64c2009c30"></script><dialog id="course-dialog" aria-labelledby="course-title"><header><button id="course-back" aria-label="返回上一级" title="返回上一级">←</button><h2 id="course-title"></h2><button id="course-close" aria-label="关闭详情">×</button></header><div id="course-body"></div></dialog><script src="course-slides.js?v=6c2467d912a1"></script><script src="course-data.js?v=74fd1c5619f1"></script><script src="map-update.js?v=e99e7cf28c1b"></script><script src="course.js?v=51e90120e3e1"></script><script src="atlas.js?v=b01ef731a480"></script><script src="route-data.js?v=38c7f390d04a"></script><script src="route-update.js?v=f3a612b7615d"></script><script src="route-search.js?v=79ed543774ac"></script></body></html>
